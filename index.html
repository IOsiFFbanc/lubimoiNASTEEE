<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для самой лучшей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial Black', 'Segoe UI', sans-serif;
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            color: white;
            position: relative;
            touch-action: none;
        }

        /* Простой стартовый экран */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .sun-icon {
            font-size: 5rem;
            color: #FFD700;
            margin-bottom: 30px;
            animation: sunPulse 2s infinite alternate;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7));
        }

        .start-text {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.3;
        }

        .tap-instruction {
            font-size: 1.5rem;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 50px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite;
        }

        /* Стадии анимации */
        .phase {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .phase.active {
            opacity: 1;
            visibility: visible;
        }

        /* Фаза 1: Накопление энергии (3 секунды) */
        #phase1 {
            z-index: 10;
            background: #000;
        }

        .energy-center {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFD700 0%, #FF8C00 100%);
            box-shadow: 
                0 0 60px 30px rgba(255, 215, 0, 0.7),
                0 0 120px 60px rgba(255, 140, 0, 0.4);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: energyPulse 3s infinite alternate;
        }

        .energy-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: energyRing 2s infinite;
        }

        /* Фаза 2: Превышение критической массы (2 секунды) */
        #phase2 {
            z-index: 11;
            background: #000;
        }

        .critical-mass {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #FF4500 0%, #FF0000 70%, transparent 100%);
            box-shadow: 0 0 150px 80px rgba(255, 69, 0, 0.6);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: criticalMass 2s infinite alternate;
        }

        /* Фаза 3: Белая вспышка (1 секунда) */
        #phase3 {
            z-index: 12;
        }

        .white-flash {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0);
            transition: background 0.3s ease;
        }

        /* Фаза 4: Комплименты (3 секунды) */
        #phase4 {
            z-index: 13;
            background: #000;
        }

        .compliments-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 20px;
        }

        .compliment {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            animation: floatUp 2.5s forwards;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            border: 2px solid transparent;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            word-wrap: break-word;
        }

        .compliment.love {
            color: #FF69B4;
            border-color: #FF69B4;
        }

        .compliment.beauty {
            color: #FFD700;
            border-color: #FFD700;
        }

        .compliment.amazing {
            color: #00FFFF;
            border-color: #00FFFF;
        }

        .compliment.perfect {
            color: #FFA500;
            border-color: #FFA500;
        }

        .compliment.angel {
            color: #FFFFFF;
            border-color: #FFFFFF;
        }

        /* Фаза 5: Мощный взрыв (0.5 секунды) */
        #phase5 {
            z-index: 14;
            background: #000;
        }

        .explosion-particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            filter: blur(1px);
        }

        /* Фаза 6: Финальная надпись (0.5 секунды) */
        #phase6 {
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            padding: 20px;
        }

        .final-message {
            text-align: center;
            transform: scale(0.1);
            opacity: 0;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: 100%;
            max-width: 500px;
        }

        .final-message.active {
            transform: scale(1);
            opacity: 1;
        }

        .final-message h2 {
            font-size: 3.5rem;
            margin-bottom: 25px;
            background: linear-gradient(45deg, #FF69B4, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 20px rgba(255, 105, 180, 0.4);
            line-height: 1.2;
        }

        .final-message p {
            font-size: 2.5rem;
            color: #FFFFFF;
            font-style: italic;
            text-shadow: 0 2px 15px rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .hearts {
            font-size: 3rem;
            animation: heartsFloat 3s infinite;
        }

        .hearts i {
            margin: 0 15px;
            color: #FF69B4;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
        }

        /* Анимации */
        @keyframes sunPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
            }
            100% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.9));
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            }
        }

        @keyframes energyPulse {
            0% {
                width: 80px;
                height: 80px;
                box-shadow: 
                    0 0 60px 30px rgba(255, 215, 0, 0.7),
                    0 0 120px 60px rgba(255, 140, 0, 0.4);
            }
            50% {
                width: 120px;
                height: 120px;
                box-shadow: 
                    0 0 100px 50px rgba(255, 215, 0, 0.8),
                    0 0 200px 100px rgba(255, 140, 0, 0.5);
            }
            100% {
                width: 150px;
                height: 150px;
                box-shadow: 
                    0 0 150px 75px rgba(255, 215, 0, 0.9),
                    0 0 300px 150px rgba(255, 140, 0, 0.6);
            }
        }

        @keyframes energyRing {
            0% {
                width: 100px;
                height: 100px;
                opacity: 0.6;
            }
            100% {
                width: 500px;
                height: 500px;
                opacity: 0;
            }
        }

        @keyframes criticalMass {
            0% {
                width: 200px;
                height: 200px;
                box-shadow: 0 0 150px 80px rgba(255, 69, 0, 0.6);
            }
            50% {
                width: 300px;
                height: 300px;
                box-shadow: 0 0 250px 120px rgba(255, 0, 0, 0.7);
            }
            100% {
                width: 350px;
                height: 350px;
                box-shadow: 0 0 300px 150px rgba(255, 0, 0, 0.8);
            }
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0.5);
            }
            20% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            80% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.5);
            }
        }

        @keyframes heartsFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .start-text {
                font-size: 2rem;
            }
            
            .tap-instruction {
                font-size: 1.2rem;
                padding: 12px 20px;
            }
            
            .sun-icon {
                font-size: 4rem;
            }
            
            .compliment {
                font-size: 1.6rem;
                padding: 12px 20px;
            }
            
            .final-message h2 {
                font-size: 2.8rem;
            }
            
            .final-message p {
                font-size: 2rem;
            }
            
            .hearts {
                font-size: 2.5rem;
            }
        }

        @media (max-height: 600px) {
            .start-text {
                font-size: 1.8rem;
                margin-bottom: 15px;
            }
            
            .sun-icon {
                font-size: 3.5rem;
                margin-bottom: 20px;
            }
            
            .final-message h2 {
                font-size: 2.5rem;
                margin-bottom: 15px;
            }
            
            .final-message p {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .start-screen {
                flex-direction: row;
                gap: 30px;
            }
            
            .sun-icon {
                margin-bottom: 0;
                font-size: 3rem;
            }
            
            .start-text {
                font-size: 1.8rem;
                margin-bottom: 0;
            }
            
            .tap-instruction {
                margin-top: 0;
                font-size: 1rem;
            }
            
            .compliment {
                font-size: 1.4rem;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Простой стартовый экран -->
    <div class="start-screen" id="startScreen">
        <div class="sun-icon">
            <i class="fas fa-sun"></i>
        </div>
        <div class="start-text">Нажми на экран, солнышко)</div>
        <div class="tap-instruction">
            <i class="fas fa-hand-point-up"></i>
            Коснись экрана
        </div>
    </div>

    <!-- Фаза 1: Накопление энергии (3 секунды) -->
    <div class="phase" id="phase1">
        <div class="energy-center"></div>
        <div class="energy-ring" style="animation-delay: 0s;"></div>
        <div class="energy-ring" style="animation-delay: 0.5s;"></div>
        <div class="energy-ring" style="animation-delay: 1s;"></div>
        <div class="energy-ring" style="animation-delay: 1.5s;"></div>
        <div class="energy-ring" style="animation-delay: 2s;"></div>
    </div>

    <!-- Фаза 2: Превышение критической массы (2 секунды) -->
    <div class="phase" id="phase2">
        <div class="critical-mass"></div>
    </div>

    <!-- Фаза 3: Белая вспышка (1 секунда) -->
    <div class="phase" id="phase3">
        <div class="white-flash" id="whiteFlash"></div>
    </div>

    <!-- Фаза 4: Комплименты (3 секунды) -->
    <div class="phase" id="phase4">
        <div class="compliments-container" id="complimentsContainer"></div>
    </div>

    <!-- Фаза 5: Мощный взрыв (0.5 секунды) -->
    <div class="phase" id="phase5"></div>

    <!-- Фаза 6: Финальная надпись (0.5 секунды) -->
    <div class="phase" id="phase6">
        <div class="final-message">
            <h2>Я ТЕБЯ ЛЮБЛЮ!</h2>
            <p>ТЫ САМАЯ ЛУЧШАЯ ДЕВУШКА НА СВЕТЕ!</p>
            <div class="hearts">
                <i class="fas fa-heart"></i>
                <i class="fas fa-heart"></i>
                <i class="fas fa-heart"></i>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startScreen = document.getElementById('startScreen');
            const whiteFlash = document.getElementById('whiteFlash');
            const complimentsContainer = document.getElementById('complimentsContainer');
            const finalMessage = document.querySelector('.final-message');
            
            const phases = {
                1: document.getElementById('phase1'),
                2: document.getElementById('phase2'),
                3: document.getElementById('phase3'),
                4: document.getElementById('phase4'),
                5: document.getElementById('phase5'),
                6: document.getElementById('phase6')
            };
            
            let animationRunning = false;
            
            // Список комплиментов
            const compliments = [
                { text: "Ты самая красивая!", class: "beauty" },
                { text: "Ты невероятно умная!", class: "amazing" },
                { text: "Твоя улыбка сводит с ума!", class: "love" },
                { text: "Ты моё солнышко!", class: "perfect" },
                { text: "Ты совершенство!", class: "perfect" },
                { text: "Ты самая добрая!", class: "angel" },
                { text: "Твои глаза как звёзды!", class: "beauty" },
                { text: "Ты самая заботливая!", class: "angel" },
                { text: "Ты неотразима!", class: "beauty" },
                { text: "Ты моё вдохновение!", class: "love" },
                { text: "Ты лучшая на свете!", class: "perfect" },
                { text: "Ты просто ангел!", class: "angel" },
                { text: "Ты самая милая!", class: "love" },
                { text: "Ты уникальна!", class: "amazing" },
                { text: "Ты моя принцесса!", class: "love" }
            ];
            
            // Таймер для отображения времени
            let timerElement = document.createElement('div');
            timerElement.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                font-size: 1.5rem;
                color: white;
                background: rgba(0,0,0,0.5);
                padding: 10px 15px;
                border-radius: 10px;
                z-index: 999;
                display: none;
            `;
            document.body.appendChild(timerElement);
            
            // Запуск 10-секундной анимации
            function start10SecondAnimation() {
                if (animationRunning) return;
                animationRunning = true;
                
                // Прячем стартовый экран
                startScreen.style.opacity = '0';
                startScreen.style.visibility = 'hidden';
                
                // Показываем таймер
                timerElement.style.display = 'block';
                let seconds = 10;
                timerElement.textContent = `00:${seconds.toString().padStart(2, '0')}`;
                
                const timerInterval = setInterval(() => {
                    seconds--;
                    timerElement.textContent = `00:${seconds.toString().padStart(2, '0')}`;
                    
                    if (seconds <= 0) {
                        clearInterval(timerInterval);
                        setTimeout(() => {
                            timerElement.style.display = 'none';
                        }, 1000);
                    }
                }, 1000);
                
                // Фаза 1: Накопление энергии (0-3 секунды)
                startPhase(1);
                setTimeout(() => {
                    // Фаза 2: Превышение критической массы (3-5 секунды)
                    startPhase(2);
                    setTimeout(() => {
                        // Фаза 3: Белая вспышка (5-6 секунды)
                        startPhase(3);
                        setTimeout(() => {
                            // Фаза 4: Комплименты (6-9 секунды)
                            startPhase(4);
                            setTimeout(() => {
                                // Фаза 5: Мощный взрыв (9-9.5 секунды)
                                startPhase(5);
                                setTimeout(() => {
                                    // Фаза 6: Финальная надпись (9.5-10 секунды)
                                    startPhase(6);
                                }, 500); // Взрыв длится 0.5 секунды
                            }, 3000); // Комплименты длятся 3 секунды
                        }, 1000); // Белая вспышка длится 1 секунду
                    }, 2000); // Критическая масса длится 2 секунды
                }, 3000); // Накопление энергии длится 3 секунды
            }
            
            // Запуск конкретной фазы
            function startPhase(phaseNum) {
                // Скрываем все фазы
                Object.values(phases).forEach(phase => {
                    phase.classList.remove('active');
                });
                
                // Показываем нужную фазу
                phases[phaseNum].classList.add('active');
                
                // Запускаем анимации для фазы
                switch(phaseNum) {
                    case 1:
                        startPhase1();
                        break;
                    case 2:
                        startPhase2();
                        break;
                    case 3:
                        startPhase3();
                        break;
                    case 4:
                        startPhase4();
                        break;
                    case 5:
                        startPhase5();
                        break;
                    case 6:
                        startPhase6();
                        break;
                }
            }
            
            // Фаза 1: Накопление энергии (3 секунды)
            function startPhase1() {
                // Создаем частицы энергии
                createEnergyParticles(80);
                
                // Звук нарастающего гула
                playPhase1Sound();
            }
            
            // Фаза 2: Превышение критической массы (2 секунды)
            function startPhase2() {
                // Создаем энергетические щупальца
                createEnergyTendrils();
                
                // Звук нарастающей угрозы
                playPhase2Sound();
            }
            
            // Фаза 3: Белая вспышка (1 секунда)
            function startPhase3() {
                // Белая вспышка
                whiteFlash.style.background = 'rgba(255, 255, 255, 1)';
                
                // Убираем белую вспышку через 0.3 секунды
                setTimeout(() => {
                    whiteFlash.style.background = 'rgba(255, 255, 255, 0)';
                }, 300);
                
                // Звук вспышки
                playPhase3Sound();
            }
            
            // Фаза 4: Комплименты (3 секунды)
            function startPhase4() {
                // Создаем комплименты
                createCompliments();
                
                // Звук появления комплиментов
                playPhase4Sound();
            }
            
            // Фаза 5: Мощный взрыв (0.5 секунды)
            function startPhase5() {
                // Создаем мощный взрыв
                createExplosionParticles(200);
                
                // Звук взрывной волны
                playPhase5Sound();
            }
            
            // Фаза 6: Финальная надпись (0.5 секунды)
            function startPhase6() {
                setTimeout(() => {
                    finalMessage.classList.add('active');
                    
                    // Финальный звук
                    playPhase6Sound();
                    
                    // Вибрация для мобильных
                    if (navigator.vibrate) {
                        navigator.vibrate([100, 50, 100, 50, 200]);
                    }
                }, 300);
            }
            
            // Создание частиц энергии
            function createEnergyParticles(count) {
                const phase1 = phases[1];
                
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.style.cssText = `
                        position: absolute;
                        width: 10px;
                        height: 10px;
                        background: #FFD700;
                        border-radius: 50%;
                        box-shadow: 0 0 15px #FFD700;
                        opacity: 0;
                    `;
                    
                    // Случайная позиция вокруг центра
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 300 + 100;
                    const x = Math.cos(angle) * distance + window.innerWidth / 2;
                    const y = Math.sin(angle) * distance + window.innerHeight / 2;
                    
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    
                    // Анимация притяжения к центру
                    const animation = particle.animate([
                        { transform: 'scale(1)', opacity: 1 },
                        { transform: 'scale(0)', opacity: 0, left: `${window.innerWidth / 2}px`, top: `${window.innerHeight / 2}px` }
                    ], {
                        duration: Math.random() * 2000 + 1000,
                        delay: Math.random() * 1000,
                        easing: 'cubic-bezier(0.5, 0, 0.5, 1)'
                    });
                    
                    phase1.appendChild(particle);
                    
                    // Удаление после анимации
                    animation.onfinish = () => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    };
                }
            }
            
            // Создание энергетических щупалец
            function createEnergyTendrils() {
                const phase2 = phases[2];
                const tendrilCount = 20;
                
                for (let i = 0; i < tendrilCount; i++) {
                    const tendril = document.createElement('div');
                    tendril.style.cssText = `
                        position: absolute;
                        width: 3px;
                        height: 150px;
                        background: linear-gradient(to top, transparent, #FF4500);
                        top: 50%;
                        left: 50%;
                        transform-origin: bottom center;
                        border-radius: 2px;
                        box-shadow: 0 0 10px #FF4500;
                        opacity: 0.8;
                    `;
                    
                    const angle = (360 / tendrilCount) * i;
                    tendril.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-75px)`;
                    
                    phase2.appendChild(tendril);
                    
                    // Анимация щупальца
                    tendril.animate([
                        { height: '150px', opacity: 0.8 },
                        { height: '250px', opacity: 1 },
                        { height: '150px', opacity: 0.8 }
                    ], {
                        duration: 1000,
                        delay: i * 50,
                        iterations: 2,
                        easing: 'ease-in-out'
                    });
                }
            }
            
            // Создание комплиментов
            function createCompliments() {
                // Выбираем 12 случайных комплиментов
                const selectedCompliments = [];
                const usedIndices = new Set();
                
                while (selectedCompliments.length < 12 && selectedCompliments.length < compliments.length) {
                    const randomIndex = Math.floor(Math.random() * compliments.length);
                    if (!usedIndices.has(randomIndex)) {
                        selectedCompliments.push(compliments[randomIndex]);
                        usedIndices.add(randomIndex);
                    }
                }
                
                // Создаем элементы для каждого комплимента
                selectedCompliments.forEach((compliment, index) => {
                    setTimeout(() => {
                        createComplimentElement(compliment, index);
                    }, index * 250); // Появление с задержкой 250мс
                });
            }
            
            // Создание элемента комплимента
            function createComplimentElement(compliment, index) {
                const element = document.createElement('div');
                element.classList.add('compliment', compliment.class);
                element.textContent = compliment.text;
                
                // Позиция на экране
                const isLandscape = window.innerWidth > window.innerHeight;
                let x, y;
                
                if (isLandscape) {
                    x = Math.random() * (window.innerWidth - 300) + 150;
                    y = Math.random() * (window.innerHeight - 80) + 40;
                } else {
                    x = Math.random() * (window.innerWidth - 200) + 100;
                    y = Math.random() * (window.innerHeight - 100) + 50;
                }
                
                element.style.left = `${x}px`;
                element.style.top = `${y}px`;
                
                // Случайный размер
                const size = Math.random() * 0.4 + 0.8;
                element.style.fontSize = `${2 * size}rem`;
                
                complimentsContainer.appendChild(element);
                
                // Удаляем элемент после анимации
                setTimeout(() => {
                    if (element.parentNode) {
                        element.remove();
                    }
                }, 2500);
            }
            
            // Создание частиц взрыва
            function createExplosionParticles(count) {
                const phase5 = phases[5];
                const colors = ['#FF69B4', '#FFD700', '#FFA500', '#00FFFF', '#FFFFFF', '#FF4500'];
                
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('explosion-particle');
                    
                    // Параметры
                    const size = Math.random() * 20 + 5;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const x = window.innerWidth / 2;
                    const y = window.innerHeight / 2;
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 1000 + 300;
                    
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.backgroundColor = color;
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;
                    
                    phase5.appendChild(particle);
                    
                    // Анимация разлета частиц
                    const animation = particle.animate([
                        { 
                            opacity: 1,
                            transform: 'translate(0, 0) scale(1)',
                        },
                        { 
                            opacity: 0,
                            transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0.1)`,
                        }
                    ], {
                        duration: Math.random() * 600 + 400,
                        easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)'
                    });
                    
                    // Удаление после анимации
                    animation.onfinish = () => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    };
                }
            }
            
            // Звуковые эффекты (с обработкой ошибок для мобильных)
            function playPhase1Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    const oscillator = audioContext.createOscillator();
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(120, audioContext.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(280, audioContext.currentTime + 3);
                    
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 3);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 3);
                } catch (e) {
                    console.log("Аудио не поддерживается");
                }
            }
            
            function playPhase2Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    const oscillator = audioContext.createOscillator();
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(180, audioContext.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(450, audioContext.currentTime + 2);
                    
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.4, audioContext.currentTime + 2);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 2);
                } catch (e) {
                    console.log("Аудио не поддерживается");
                }
            }
            
            function playPhase3Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    const oscillator = audioContext.createOscillator();
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(1200, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(80, audioContext.currentTime + 0.3);
                    
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.3);
                } catch (e) {
                    console.log("Аудио не поддерживается");
                }
            }
            
            function playPhase4Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    for (let i = 0; i < 12; i++) {
                        setTimeout(() => {
                            const oscillator = audioContext.createOscillator();
                            oscillator.type = 'sine';
                            oscillator.frequency.setValueAtTime(523.25 + i * 80, audioContext.currentTime);
                            
                            const gainNode = audioContext.createGain();
                            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                            
                            oscillator.connect(gainNode);
                            gainNode.connect(audioContext.destination);
                            
                            oscillator.start();
                            oscillator.stop(audioContext.currentTime + 0.2);
                        }, i * 250);
                    }
                } catch (e) {
                    console.log("Аудио не поддерживается");
                }
            }
            
            function playPhase5Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    const oscillator1 = audioContext.createOscillator();
                    oscillator1.type = 'sine';
                    oscillator1.frequency.setValueAtTime(70, audioContext.currentTime);
                    oscillator1.frequency.exponentialRampToValueAtTime(25, audioContext.currentTime + 0.5);
                    
                    const gainNode1 = audioContext.createGain();
                    gainNode1.gain.setValueAtTime(0.4, audioContext.currentTime);
                    gainNode1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    oscillator1.connect(gainNode1);
                    gainNode1.connect(audioContext.destination);
                    
                    oscillator1.start();
                    oscillator1.stop(audioContext.currentTime + 0.5);
                } catch (e) {
                    console.log("Аудио не поддерживается");
                }
            }
            
            function playPhase6Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    const frequencies = [523.25, 659.25, 783.99];
                    
                    frequencies.forEach((freq, i) => {
                        setTimeout(() => {
                            const oscillator = audioContext.createOscillator();
                            oscillator.type = 'sine';
                            oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                            
                            const gainNode = audioContext.createGain();
                            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5);
                            
                            oscillator.connect(gainNode);
                            gainNode.connect(audioContext.destination);
                            
                            oscillator.start();
                            oscillator.stop(audioContext.currentTime + 1.5);
                        }, i * 80);
                    });
                } catch (e) {
                    console.log("Аудио не поддерживается");
                }
            }
            
            // Обработчики событий
            function handleStart(e) {
                if (animationRunning) return;
                
                // Вибрация (если поддерживается)
                if (navigator.vibrate) {
                    navigator.vibrate([50, 30, 50]);
                }
                
                start10SecondAnimation();
            }
            
            // Добавляем обработчики для сенсорных устройств
            document.addEventListener('click', handleStart);
            document.addEventListener('touchstart', function(e) {
                e.preventDefault();
                handleStart(e);
            }, { passive: false });
        });
    </script>
</body>
