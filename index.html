<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для самой лучшей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            cursor: pointer;
        }

        /* Простой стартовый экран */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: opacity 0.8s ease;
        }

        .sun-icon {
            font-size: 5rem;
            color: #FFD700;
            margin-bottom: 30px;
            animation: sunPulse 2s infinite alternate;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7));
        }

        .start-text {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.3;
            padding: 0 20px;
        }

        .tap-instruction {
            font-size: 1.5rem;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 50px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite;
            cursor: pointer;
        }

        .tap-instruction:active {
            transform: scale(0.95);
        }

        /* Стадии анимации */
        .phase {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .phase.active {
            opacity: 1;
            visibility: visible;
        }

        /* Фаза 1: Накопление энергии (3 секунды) */
        #phase1 {
            z-index: 10;
            background: #000;
        }

        .energy-center {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFD700 0%, #FF8C00 100%);
            box-shadow: 
                0 0 60px 30px rgba(255, 215, 0, 0.7),
                0 0 120px 60px rgba(255, 140, 0, 0.4);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: energyPulse 3s infinite alternate;
        }

        .energy-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: energyRing 2s infinite;
        }

        /* Фаза 2: Превышение критической массы (2 секунды) */
        #phase2 {
            z-index: 11;
            background: #000;
        }

        .critical-mass {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #FF4500 0%, #FF0000 70%, transparent 100%);
            box-shadow: 0 0 150px 80px rgba(255, 69, 0, 0.6);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: criticalMass 2s infinite alternate;
        }

        /* Фаза 3: Белая вспышка (1 секунда) */
        #phase3 {
            z-index: 12;
        }

        .white-flash {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0);
            transition: background 0.3s ease;
        }

        /* Фаза 4: Комплименты (3 секунды) - ЦЕНТРИРОВАННЫЕ */
        #phase4 {
            z-index: 13;
            background: #000;
        }

        .compliments-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .compliments-wrapper {
            position: relative;
            width: 90%;
            max-width: 600px;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .compliment {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            animation: floatUpCentered 2.5s forwards;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            border: 2px solid transparent;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            word-wrap: break-word;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        /* Цвета для комплиментов */
        .compliment.love {
            color: #FF69B4;
            border-color: #FF69B4;
        }

        .compliment.beauty {
            color: #FFD700;
            border-color: #FFD700;
        }

        .compliment.amazing {
            color: #00FFFF;
            border-color: #00FFFF;
        }

        .compliment.perfect {
            color: #FFA500;
            border-color: #FFA500;
        }

        .compliment.angel {
            color: #FFFFFF;
            border-color: #FFFFFF;
        }

        /* Фаза 5: Мощный взрыв (0.5 секунды) */
        #phase5 {
            z-index: 14;
            background: #000;
        }

        .explosion-particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            filter: blur(1px);
        }

        /* Фаза 6: Финальная надпись (0.5 секунды) */
        #phase6 {
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            padding: 20px;
        }

        .final-message {
            text-align: center;
            transform: scale(0.1);
            opacity: 0;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: 100%;
            max-width: 500px;
        }

        .final-message.active {
            transform: scale(1);
            opacity: 1;
        }

        .final-message h2 {
            font-size: 3.5rem;
            margin-bottom: 25px;
            background: linear-gradient(45deg, #FF69B4, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 20px rgba(255, 105, 180, 0.4);
            line-height: 1.2;
        }

        .final-message p {
            font-size: 2.5rem;
            color: #FFFFFF;
            font-style: italic;
            text-shadow: 0 2px 15px rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .hearts {
            font-size: 3rem;
            animation: heartsFloat 3s infinite;
        }

        .hearts i {
            margin: 0 15px;
            color: #FF69B4;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
        }

        /* Таймер */
        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 10px;
            z-index: 999;
            display: none;
            font-weight: bold;
        }

        /* Анимации */
        @keyframes sunPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
            }
            100% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.9));
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            }
        }

        @keyframes energyPulse {
            0% {
                width: 80px;
                height: 80px;
                box-shadow: 
                    0 0 60px 30px rgba(255, 215, 0, 0.7),
                    0 0 120px 60px rgba(255, 140, 0, 0.4);
            }
            50% {
                width: 120px;
                height: 120px;
                box-shadow: 
                    0 0 100px 50px rgba(255, 215, 0, 0.8),
                    0 0 200px 100px rgba(255, 140, 0, 0.5);
            }
            100% {
                width: 150px;
                height: 150px;
                box-shadow: 
                    0 0 150px 75px rgba(255, 215, 0, 0.9),
                    0 0 300px 150px rgba(255, 140, 0, 0.6);
            }
        }

        @keyframes energyRing {
            0% {
                width: 100px;
                height: 100px;
                opacity: 0.6;
            }
            100% {
                width: 500px;
                height: 500px;
                opacity: 0;
            }
        }

        @keyframes criticalMass {
            0% {
                width: 200px;
                height: 200px;
                box-shadow: 0 0 150px 80px rgba(255, 69, 0, 0.6);
            }
            50% {
                width: 300px;
                height: 300px;
                box-shadow: 0 0 250px 120px rgba(255, 0, 0, 0.7);
            }
            100% {
                width: 350px;
                height: 350px;
                box-shadow: 0 0 300px 150px rgba(255, 0, 0, 0.8);
            }
        }

        /* НОВАЯ АНИМАЦИЯ ДЛЯ ЦЕНТРИРОВАННЫХ КОМПЛИМЕНТОВ */
        @keyframes floatUpCentered {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(50px) scale(0.8);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-50px) scale(0.8);
            }
        }

        @keyframes heartsFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .start-text {
                font-size: 2rem;
            }
            
            .tap-instruction {
                font-size: 1.2rem;
                padding: 12px 20px;
            }
            
            .sun-icon {
                font-size: 4rem;
            }
            
            .compliment {
                font-size: 1.6rem;
                padding: 12px 20px;
                max-width: 85%;
            }
            
            .final-message h2 {
                font-size: 2.8rem;
            }
            
            .final-message p {
                font-size: 2rem;
            }
            
            .hearts {
                font-size: 2.5rem;
            }
            
            .timer {
                font-size: 1.2rem;
                top: 10px;
                right: 10px;
                padding: 8px 12px;
            }
        }

        @media (max-width: 360px) {
            .compliment {
                font-size: 1.4rem;
                padding: 10px 15px;
            }
            
            .start-text {
                font-size: 1.8rem;
            }
        }

        @media (max-height: 600px) {
            .start-text {
                font-size: 1.8rem;
                margin-bottom: 15px;
            }
            
            .sun-icon {
                font-size: 3.5rem;
                margin-bottom: 20px;
            }
            
            .final-message h2 {
                font-size: 2.5rem;
                margin-bottom: 15px;
            }
            
            .final-message p {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
            
            .compliment {
                font-size: 1.5rem;
                padding: 10px 15px;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .start-screen {
                flex-direction: row;
                gap: 30px;
                flex-wrap: wrap;
            }
            
            .sun-icon {
                margin-bottom: 0;
                font-size: 3rem;
            }
            
            .start-text {
                font-size: 1.8rem;
                margin-bottom: 0;
            }
            
            .tap-instruction {
                margin-top: 0;
                font-size: 1rem;
                padding: 10px 15px;
            }
            
            .compliment {
                font-size: 1.4rem;
                padding: 8px 12px;
            }
            
            .compliments-wrapper {
                height: 90%;
            }
        }

        /* Для очень широких экранов */
        @media (min-width: 1200px) {
            .compliment {
                font-size: 2.2rem;
                padding: 18px 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Простой стартовый экран -->
    <div class="start-screen" id="startScreen">
        <div class="sun-icon">
            <i class="fas fa-sun"></i>
        </div>
        <div class="start-text">Нажми на экран, солнышко)</div>
        <div class="tap-instruction" id="tapButton">
            <i class="fas fa-hand-point-up"></i>
            Коснись экрана
        </div>
    </div>

    <!-- Таймер -->
    <div class="timer" id="timer">00:10</div>

    <!-- Фаза 1: Накопление энергии (3 секунды) -->
    <div class="phase" id="phase1">
        <div class="energy-center"></div>
        <div class="energy-ring" style="animation-delay: 0s;"></div>
        <div class="energy-ring" style="animation-delay: 0.5s;"></div>
        <div class="energy-ring" style="animation-delay: 1s;"></div>
    </div>

    <!-- Фаза 2: Превышение критической массы (2 секунды) -->
    <div class="phase" id="phase2">
        <div class="critical-mass"></div>
    </div>

    <!-- Фаза 3: Белая вспышка (1 секунда) -->
    <div class="phase" id="phase3">
        <div class="white-flash" id="whiteFlash"></div>
    </div>

    <!-- Фаза 4: Комплименты (3 секунды) - ЦЕНТРИРОВАННЫЕ -->
    <div class="phase" id="phase4">
        <div class="compliments-container">
            <div class="compliments-wrapper" id="complimentsWrapper"></div>
        </div>
    </div>

    <!-- Фаза 5: Мощный взрыв (0.5 секунды) -->
    <div class="phase" id="phase5"></div>

    <!-- Фаза 6: Финальная надпись (0.5 секунды) -->
    <div class="phase" id="phase6">
        <div class="final-message">
            <h2>Я ТЕБЯ ЛЮБЛЮ!</h2>
            <p>ТЫ САМАЯ ЛУЧШАЯ ДЕВУШКА НА СВЕТЕ!</p>
            <div class="hearts">
                <i class="fas fa-heart"></i>
                <i class="fas fa-heart"></i>
                <i class="fas fa-heart"></i>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startScreen = document.getElementById('startScreen');
            const tapButton = document.getElementById('tapButton');
            const timerElement = document.getElementById('timer');
            const whiteFlash = document.getElementById('whiteFlash');
            const complimentsWrapper = document.getElementById('complimentsWrapper');
            const finalMessage = document.querySelector('.final-message');
            
            const phases = {
                1: document.getElementById('phase1'),
                2: document.getElementById('phase2'),
                3: document.getElementById('phase3'),
                4: document.getElementById('phase4'),
                5: document.getElementById('phase5'),
                6: document.getElementById('phase6')
            };
            
            let animationRunning = false;
            
            // Список комплиментов - ОТЦЕНТРИРОВАННЫЕ
            const compliments = [
                { text: "Ты самая красивая!", class: "beauty" },
                { text: "Ты невероятно умная!", class: "amazing" },
                { text: "Твоя улыбка сводит с ума!", class: "love" },
                { text: "Ты моё солнышко!", class: "perfect" },
                { text: "Ты совершенство!", class: "perfect" },
                { text: "Ты самая добрая!", class: "angel" },
                { text: "Твои глаза как звёзды!", class: "beauty" },
                { text: "Ты самая заботливая!", class: "angel" },
                { text: "Ты неотразима!", class: "beauty" },
                { text: "Ты моё вдохновение!", class: "love" },
                { text: "Ты лучшая на свете!", class: "perfect" },
                { text: "Ты просто ангел!", class: "angel" },
                { text: "Ты самая милая!", class: "love" },
                { text: "Ты уникальна!", class: "amazing" },
                { text: "Ты моя принцесса!", class: "love" },
                { text: "Ты самая лучшая!", class: "perfect" },
                { text: "Ты невероятно добрая!", class: "angel" },
                { text: "Твоё сердце золотое!", class: "beauty" },
                { text: "Ты моя мечта!", class: "love" },
                { text: "Ты самая замечательная!", class: "amazing" }
            ];
            
            // Функция для мобильных устройств
            function isTouchDevice() {
                return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            }
            
            // Основная функция запуска анимации
            function startAnimation() {
                if (animationRunning) return;
                
                console.log("Запуск анимации...");
                animationRunning = true;
                
                // Вибрация для мобильных
                if (navigator.vibrate) {
                    navigator.vibrate([50]);
                }
                
                // Плавно скрываем стартовый экран
                startScreen.style.opacity = '0';
                
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    
                    // Показываем таймер
                    timerElement.style.display = 'block';
                    let seconds = 10;
                    timerElement.textContent = `00:${seconds.toString().padStart(2, '0')}`;
                    
                    // Таймер обратного отсчета
                    const timerInterval = setInterval(() => {
                        seconds--;
                        timerElement.textContent = `00:${seconds.toString().padStart(2, '0')}`;
                        
                        if (seconds <= 0) {
                            clearInterval(timerInterval);
                            setTimeout(() => {
                                timerElement.style.display = 'none';
                            }, 1000);
                        }
                    }, 1000);
                    
                    // Запускаем 10-секундную анимацию
                    start10SecondAnimation();
                    
                }, 800);
            }
            
            // 10-секундная анимация
            function start10SecondAnimation() {
                // Фаза 1: Накопление энергии (0-3 секунды)
                startPhase(1);
                
                setTimeout(() => {
                    // Фаза 2: Превышение критической массы (3-5 секунды)
                    startPhase(2);
                    
                    setTimeout(() => {
                        // Фаза 3: Белая вспышка (5-6 секунды)
                        startPhase(3);
                        
                        setTimeout(() => {
                            // Фаза 4: Комплименты (6-9 секунды)
                            startPhase(4);
                            
                            setTimeout(() => {
                                // Фаза 5: Мощный взрыв (9-9.5 секунды)
                                startPhase(5);
                                
                                setTimeout(() => {
                                    // Фаза 6: Финальная надпись (9.5-10 секунды)
                                    startPhase(6);
                                }, 500);
                            }, 3000);
                        }, 1000);
                    }, 2000);
                }, 3000);
            }
            
            // Запуск конкретной фазы
            function startPhase(phaseNum) {
                console.log(`Запуск фазы ${phaseNum}`);
                
                // Скрываем все фазы
                Object.values(phases).forEach(phase => {
                    phase.classList.remove('active');
                });
                
                // Показываем нужную фазу
                phases[phaseNum].classList.add('active');
                
                // Запускаем анимации для фазы
                switch(phaseNum) {
                    case 1:
                        startPhase1();
                        break;
                    case 2:
                        startPhase2();
                        break;
                    case 3:
                        startPhase3();
                        break;
                    case 4:
                        startPhase4();
                        break;
                    case 5:
                        startPhase5();
                        break;
                    case 6:
                        startPhase6();
                        break;
                }
            }
            
            // Фаза 1: Накопление энергии (3 секунды)
            function startPhase1() {
                createEnergyParticles(50);
                playPhase1Sound();
            }
            
            // Фаза 2: Превышение критической массы (2 секунды)
            function startPhase2() {
                createEnergyTendrils();
                playPhase2Sound();
            }
            
            // Фаза 3: Белая вспышка (1 секунда)
            function startPhase3() {
                whiteFlash.style.background = 'rgba(255, 255, 255, 1)';
                
                setTimeout(() => {
                    whiteFlash.style.background = 'rgba(255, 255, 255, 0)';
                }, 300);
                
                playPhase3Sound();
            }
            
            // Фаза 4: Комплименты (3 секунды) - ЦЕНТРИРОВАННЫЕ
            function startPhase4() {
                createCenteredCompliments();
                playPhase4Sound();
            }
            
            // Фаза 5: Мощный взрыв (0.5 секунды)
            function startPhase5() {
                createExplosionParticles(150);
                playPhase5Sound();
            }
            
            // Фаза 6: Финальная надпись (0.5 секунды)
            function startPhase6() {
                setTimeout(() => {
                    finalMessage.classList.add('active');
                    playPhase6Sound();
                    
                    if (navigator.vibrate) {
                        navigator.vibrate([100, 50, 100, 50, 200]);
                    }
                }, 300);
            }
            
            // Создание частиц энергии
            function createEnergyParticles(count) {
                const phase1 = phases[1];
                
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const particle = document.createElement('div');
                        particle.style.cssText = `
                            position: absolute;
                            width: 8px;
                            height: 8px;
                            background: #FFD700;
                            border-radius: 50%;
                            box-shadow: 0 0 10px #FFD700;
                            opacity: 0;
                        `;
                        
                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * 200 + 50;
                        const x = Math.cos(angle) * distance + window.innerWidth / 2;
                        const y = Math.sin(angle) * distance + window.innerHeight / 2;
                        
                        particle.style.left = `${x}px`;
                        particle.style.top = `${y}px`;
                        
                        const animation = particle.animate([
                            { transform: 'scale(1)', opacity: 1 },
                            { transform: 'scale(0)', opacity: 0, left: `${window.innerWidth / 2}px`, top: `${window.innerHeight / 2}px` }
                        ], {
                            duration: 2000,
                            easing: 'cubic-bezier(0.5, 0, 0.5, 1)'
                        });
                        
                        phase1.appendChild(particle);
                        
                        animation.onfinish = () => {
                            if (particle.parentNode) particle.remove();
                        };
                    }, i * 50);
                }
            }
            
            // Создание энергетических щупалец
            function createEnergyTendrils() {
                const phase2 = phases[2];
                const tendrilCount = 12;
                
                for (let i = 0; i < tendrilCount; i++) {
                    const tendril = document.createElement('div');
                    tendril.style.cssText = `
                        position: absolute;
                        width: 3px;
                        height: 100px;
                        background: linear-gradient(to top, transparent, #FF4500);
                        top: 50%;
                        left: 50%;
                        transform-origin: bottom center;
                        border-radius: 2px;
                        box-shadow: 0 0 10px #FF4500;
                        opacity: 0.8;
                    `;
                    
                    const angle = (360 / tendrilCount) * i;
                    tendril.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-50px)`;
                    
                    phase2.appendChild(tendril);
                    
                    tendril.animate([
                        { height: '100px', opacity: 0.8 },
                        { height: '180px', opacity: 1 },
                        { height: '100px', opacity: 0.8 }
                    ], {
                        duration: 1000,
                        delay: i * 50,
                        iterations: 2,
                        easing: 'ease-in-out'
                    });
                }
            }
            
            // СОЗДАНИЕ ЦЕНТРИРОВАННЫХ КОМПЛИМЕНТОВ
            function createCenteredCompliments() {
                // Выбираем 10 случайных комплиментов
                const selectedCompliments = [];
                const usedIndices = new Set();
                
                while (selectedCompliments.length < 10 && selectedCompliments.length < compliments.length) {
                    const randomIndex = Math.floor(Math.random() * compliments.length);
                    if (!usedIndices.has(randomIndex)) {
                        selectedCompliments.push(compliments[randomIndex]);
                        usedIndices.add(randomIndex);
                    }
                }
                
                // Позиции по вертикали для комплиментов
                const verticalPositions = [
                    '10%', '15%', '20%', '25%', '30%', 
                    '70%', '75%', '80%', '85%', '90%'
                ];
                
                // Перемешиваем позиции
                verticalPositions.sort(() => Math.random() - 0.5);
                
                // Создаем комплименты в центре экрана
                selectedCompliments.forEach((compliment, index) => {
                    setTimeout(() => {
                        createCenteredComplimentElement(compliment, verticalPositions[index % verticalPositions.length]);
                    }, index * 280); // Интервал 280мс между появлением
                });
            }
            
            // Создание элемента центрированного комплимента
            function createCenteredComplimentElement(compliment, verticalPosition) {
                const element = document.createElement('div');
                element.classList.add('compliment', compliment.class);
                element.textContent = compliment.text;
                
                // Центрируем по горизонтали, позиция по вертикали задается параметром
                element.style.top = verticalPosition;
                
                // Случайный небольшой сдвиг влево для естественности (от -20px до +20px)
                const randomOffset = (Math.random() * 40 - 20);
                
                complimentsWrapper.appendChild(element);
                
                // Добавляем небольшой случайный сдвиг влево/вправо для разнообразия
                setTimeout(() => {
                    element.style.transform = `translateX(calc(-50% + ${randomOffset}px))`;
                }, 10);
                
                // Удаляем элемент после анимации
                setTimeout(() => {
                    if (element.parentNode) element.remove();
                }, 2500);
            }
            
            // Создание частиц взрыва
            function createExplosionParticles(count) {
                const phase5 = phases[5];
                const colors = ['#FF69B4', '#FFD700', '#FFA500', '#00FFFF', '#FFFFFF', '#FF4500'];
                
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('explosion-particle');
                    
                    const size = Math.random() * 15 + 5;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const x = window.innerWidth / 2;
                    const y = window.innerHeight / 2;
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 600 + 200;
                    
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.backgroundColor = color;
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    particle.style.boxShadow = `0 0 ${size * 1.5}px ${color}`;
                    
                    phase5.appendChild(particle);
                    
                    const animation = particle.animate([
                        { 
                            opacity: 1,
                            transform: 'translate(0, 0) scale(1)',
                        },
                        { 
                            opacity: 0,
                            transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0.1)`,
                        }
                    ], {
                        duration: 500 + Math.random() * 300,
                        easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)'
                    });
                    
                    animation.onfinish = () => {
                        if (particle.parentNode) particle.remove();
                    };
                }
            }
            
            // Звуковые эффекты
            function playPhase1Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(120, audioContext.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(250, audioContext.currentTime + 3);
                    
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.15, audioContext.currentTime + 3);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 3);
                } catch(e) {}
            }
            
            function playPhase2Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(150, audioContext.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(350, audioContext.currentTime + 2);
                    
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 2);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 2);
                } catch(e) {}
            }
            
            function playPhase3Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.3);
                    
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.3);
                } catch(e) {}
            }
            
            function playPhase4Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    for (let i = 0; i < 10; i++) {
                        setTimeout(() => {
                            const oscillator = audioContext.createOscillator();
                            oscillator.type = 'sine';
                            oscillator.frequency.setValueAtTime(500 + i * 40, audioContext.currentTime);
                            
                            const gainNode = audioContext.createGain();
                            gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                            
                            oscillator.connect(gainNode);
                            gainNode.connect(audioContext.destination);
                            
                            oscillator.start();
                            oscillator.stop(audioContext.currentTime + 0.2);
                        }, i * 280);
                    }
                } catch(e) {}
            }
            
            function playPhase5Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(60, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(20, audioContext.currentTime + 0.5);
                    
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.5);
                } catch(e) {}
            }
            
            function playPhase6Sound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    [500, 600, 700].forEach((freq, i) => {
                        setTimeout(() => {
                            const oscillator = audioContext.createOscillator();
                            oscillator.type = 'sine';
                            oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                            
                            const gainNode = audioContext.createGain();
                            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
                            
                            oscillator.connect(gainNode);
                            gainNode.connect(audioContext.destination);
                            
                            oscillator.start();
                            oscillator.stop(audioContext.currentTime + 1);
                        }, i * 100);
                    });
                } catch(e) {}
            }
            
            // ОБРАБОТЧИКИ СОБЫТИЙ
            function handleStart(e) {
                e.preventDefault();
                e.stopPropagation();
                
                console.log("Событие получено:", e.type);
                startAnimation();
                return false;
            }
            
            // Основной обработчик клика/касания
            tapButton.addEventListener('click', handleStart);
            tapButton.addEventListener('touchend', handleStart);
            
            // Также обрабатываем касание всего экрана
            startScreen.addEventListener('click', handleStart);
            startScreen.addEventListener('touchend', handleStart);
            
            // Предотвращаем стандартное поведение касаний
            document.addEventListener('touchstart', function(e) {
                if (e.target === tapButton || e.target === startScreen) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            console.log("Скрипт загружен, устройство с тачскрином:", isTouchDevice());
        });
    </script>
</body>
</html>
